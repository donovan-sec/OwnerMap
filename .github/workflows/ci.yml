name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual and scheduled runs scan full git history; PR runs scan only the PR's commits.
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # No package.json: tests use only Node built-ins, so there is nothing to install.
      - run: node --test tests/*.test.js

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # The repo has no linter configured. Run ESLint recommended rules with a
      # throwaway config kept outside the repo.
      - name: Install ESLint
        working-directory: ${{ runner.temp }}
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund eslint@9.39.1 @eslint/js@9.39.1 globals@16.5.0
          cat > eslint.config.mjs <<'CFG'
          import js from "@eslint/js";
          import globals from "globals";
          export default [
            js.configs.recommended,
            {
              files: ["**/*.js"],
              languageOptions: {
                sourceType: "commonjs",
                globals: { ...globals.node, ...globals.browser },
              },
            },
          ];
          CFG
      - name: ESLint
        run: '"$RUNNER_TEMP/node_modules/.bin/eslint" -c "$RUNNER_TEMP/eslint.config.mjs" src tests'

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
